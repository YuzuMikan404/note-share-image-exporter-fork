name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${VERSION}."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package plugin
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          mkdir -p release-package
          cp main.js manifest.json styles.css release-package/
          cd release-package
          zip -r "../readable-note-exporter-${VERSION}.zip" main.js manifest.json styles.css

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./manifest.json').version")"
          ASSETS=(
            main.js
            manifest.json
            styles.css
            "readable-note-exporter-${VERSION}.zip"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "Readable Note Exporter ${VERSION}" \
              --generate-notes
          fi
